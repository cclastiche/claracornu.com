<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clara Cornu</title>
  <meta name="description" content="Clara Cornu. Chief of Staff at PriorLabs. Berlin.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdfdfc;
      --text: #1a1a18;
      --muted: #706e66;
      --line: #e8e6e0;
      --accent: #1a1a18;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412;
        --text: #ececea;
        --muted: #9b9992;
        --line: #2a2a27;
        --accent: #ececea;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 18vh 24px 12vh;
    }
    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 500;
      font-size: 2.6rem;
      line-height: 1.1;
      margin: 0 0 0.4rem;
      letter-spacing: -0.01em;
    }
    .role {
      color: var(--muted);
      margin: 0 0 3rem;
      font-size: 1rem;
    }
    section {
      margin: 0 0 3rem;
    }
    section h2 {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.9rem;
    }
    p { margin: 0 0 1rem; }
    a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 3px;
      transition: text-decoration-color 0.15s ease;
    }
    a:hover { text-decoration-color: var(--accent); }
    footer {
      border-top: 1px solid var(--line);
      padding-top: 1.4rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 480px) {
      main { padding-top: 12vh; }
      h1 { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Clara Cornu</h1>
    <p class="role">Chief of Staff at PriorLabs &middot; Berlin</p>

    <section>
      <h2>About</h2>
      <p>I lead operations at <a href="https://priorlabs.ai">PriorLabs</a>, the company behind TabPFN, a foundation model for tabular data. My work spans operations, finance, people and go-to-market: building the processes that let a research-driven company move fast.</p>
    </section>

    <!-- Extensible: add sections here later, e.g.
    <section>
      <h2>Notes</h2>
      ...
    </section>
    -->

    <footer>
      Berlin &middot; 2026
    </footer>
  </main>
</body>
</html>
